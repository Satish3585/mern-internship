version: '3.8'

services:

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mern-network

  # Backend API (Node + Express)
  backend:
    build: ./task1-api
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/shopDB
      - JWT_SECRET=yourjwtsecrethere
      - JWT_EXPIRE=7d
    depends_on:
      - mongodb
    networks:
      - mern-network

  # Frontend (React + Nginx)
  frontend:
    build: ./task2-react-frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mern-network

# Volumes
volumes:
  mongodb_data:

# Networks
networks:
  mern-network:
    driver: bridge
